<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#02030a">
  <title>Trailer Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="build-badge">build 1.0.4</div>

  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <div class="brand" aria-label="Trailer Hub">
        <div class="brand-mark">L</div>
        <span>Trailer Hub</span>
      </div>

      <nav class="nav" aria-label="Categorias principais">
        <button class="nav-link focusable active" data-nav="home" type="button">Início</button>
        <button class="nav-link focusable" data-nav="movies" type="button">Filmes</button>
        <button class="nav-link focusable" data-nav="series" type="button">Séries</button>
        <button class="nav-link focusable" data-nav="kids" type="button">Infantil</button>
      </nav>

      <div class="search-box">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16.5 16.5 4 4"></path>
          </svg>
        </span>
        <input id="searchInput" class="search focusable" type="text" placeholder="Buscar trailers" autocomplete="off" inputmode="search">
        <div id="suggestions" class="suggestions" aria-live="polite"></div>
      </div>

      <button class="profile focusable" type="button" aria-label="Perfil">LC</button>
    </header>

    <section id="hero" class="hero" aria-live="polite">
      <img id="heroBackdrop" class="hero-backdrop" alt="">
      <div class="hero-poster-frame">
        <img id="heroPoster" class="hero-poster" alt="">
      </div>
      <div class="hero-shade"></div>
      <div class="hero-content">
        <div class="eyebrow">Trailer em destaque</div>
        <h1 id="heroTitle" class="hero-title">Trailer Hub</h1>
        <div id="heroMeta" class="hero-meta"></div>
        <p id="heroDescription" class="hero-description">Carregando experiências cinematográficas...</p>
        <div class="hero-actions">
          <a id="heroPlay" class="primary-action focusable" href="https://www.youtube.com/results?search_query=Trailer%20Hub%20trailer" onclick="return TrailerHubActions.playHero(event)">
            <span class="play-icon" aria-hidden="true"></span>
            <span>Assistir trailer</span>
          </a>
          <button id="heroInfo" class="secondary-action focusable" type="button" onclick="return TrailerHubActions.showHeroInfo(event)">Mais informações</button>
        </div>
      </div>
    </section>

    <main id="content" class="content" aria-live="polite"></main>
  </div>

  <section id="detailsPanel" class="details-panel" aria-hidden="true">
    <div class="details-card">
      <button id="detailsClose" class="close focusable" type="button" aria-label="Fechar" onclick="return TrailerHubActions.closeDetails(event)"></button>
      <img id="detailsBackdrop" class="details-backdrop" alt="">
      <div class="details-shade"></div>
      <div class="details-content">
        <h2 id="detailsTitle"></h2>
        <div id="detailsMeta" class="details-meta"></div>
        <p id="detailsOverview"></p>
        <a id="detailsPlay" class="primary-action focusable" href="https://www.youtube.com/results?search_query=Trailer%20Hub%20trailer" onclick="return TrailerHubActions.playDetails(event)">
          <span class="play-icon" aria-hidden="true"></span>
          <span>Assistir trailer</span>
        </a>
      </div>
    </div>
  </section>

  <section id="modal" class="modal" aria-hidden="true">
    <div class="player-shell">
      <div id="yt"></div>
      <div id="playerLoading" class="player-status visible">Carregando trailer...</div>
      <div id="playerOverlay" class="player-overlay">
        <button id="closeButton" class="close focusable" type="button" aria-label="Fechar trailer" onclick="return TrailerHubActions.closePlayer(event)"></button>
        <div>
          <div id="playerTitle" class="player-title">Trailer Hub</div>
          <div class="player-hint">Enter pausa/reproduz • Esc/Back sai</div>
          <button id="nextTrailerButton" class="retry-trailer focusable" type="button" onclick="return TrailerHubActions.nextTrailer(event)">Tentar outro trailer</button>
          <a id="externalTrailerLink" class="external-trailer focusable" href="https://www.youtube.com/results?search_query=Trailer%20Hub%20trailer">Abrir no YouTube</a>
        </div>
      </div>
    </div>
  </section>

  <script src="$WEBAPIS/webOS.js"></script>
  <script src="src/tmdb.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
