<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trailer Hub</title>
  <style>
    :root {
      --bg: #040714;
      --panel: #0b1020;
      --text: #f9f9f9;
      --muted: #aab4c8;
      --accent: #2f80ed;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 76% 10%, rgba(38, 83, 170, .28), transparent 32%),
        linear-gradient(180deg, #08111f 0%, #040714 55%, #040714 100%);
    }

    button, input { font: inherit; }

    .app {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    .app::-webkit-scrollbar { display: none; }

    .topbar {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      right: 0;
      height: 96px;
      display: flex;
      align-items: center;
      padding: 0 66px;
      background: linear-gradient(180deg, rgba(4,7,20,.98), rgba(4,7,20,.65), transparent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 60px;
      height: 44px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2f80ed, #1647a8);
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(47,128,237,.32);
      font-size: 25px;
    }

    .search {
      margin-left: auto;
      width: 430px;
      height: 54px;
      padding: 0 20px;
      color: #fff;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      outline: none;
      font-size: 21px;
    }

    .hero {
      position: relative;
      height: 650px;
      overflow: hidden;
      background: #0a1020;
    }

    .hero-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .45s ease;
    }

    .hero.ready .hero-backdrop { opacity: 1; }

    .hero-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, #040714 0%, rgba(4,7,20,.94) 24%, rgba(4,7,20,.48) 52%, rgba(4,7,20,.05) 78%),
        linear-gradient(180deg, rgba(4,7,20,.08) 45%, #040714 100%);
    }

    .hero-content {
      position: absolute;
      z-index: 2;
      left: 70px;
      bottom: 86px;
      width: 790px;
    }

    .eyebrow {
      margin-bottom: 18px;
      color: #a7c7ff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 0;
      font-size: 74px;
      line-height: .98;
      letter-spacing: -.04em;
      text-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    .hero-meta {
      margin-top: 18px;
      color: #dce3f1;
      font-size: 20px;
      font-weight: 700;
    }

    .hero-description {
      margin: 18px 0 28px;
      color: rgba(255,255,255,.84);
      font-size: 22px;
      line-height: 1.45;
      text-shadow: 0 4px 16px rgba(0,0,0,.65);
    }

    .play {
      height: 62px;
      padding: 0 28px;
      border: 0;
      border-radius: 6px;
      color: #040714;
      background: #f9f9f9;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
    }

    .content {
      position: relative;
      z-index: 5;
      margin-top: -12px;
      padding: 0 0 30px;
    }

    .row {
      margin-top: 34px;
    }

    .row-title {
      margin: 0 0 18px;
      padding: 0 70px;
      font-size: 29px;
      letter-spacing: -.02em;
    }

    .rail {
      display: flex;
      gap: 20px;
      padding: 8px 70px 20px;
      overflow-x: hidden;
    }

    .card {
      flex: 0 0 230px;
      cursor: pointer;
      outline: none;
    }

    .poster-wrap {
      width: 230px;
      height: 345px;
      overflow: hidden;
      border-radius: 10px;
      background: linear-gradient(145deg, #18243a, #0b101b);
      box-shadow: 0 12px 28px rgba(0,0,0,.38);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-title {
      margin-top: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 19px;
      font-weight: 700;
    }

    .card-year {
      margin-top: 5px;
      color: var(--muted);
      font-size: 16px;
    }

    .card.focused .poster-wrap,
    .play:focus,
    .search:focus {
      transform: scale(1.08);
      box-shadow:
        0 0 0 5px #fff,
        0 0 0 10px rgba(255,255,255,.18),
        0 22px 54px rgba(0,0,0,.72);
    }

    .card.focused { z-index: 10; }

    .status {
      padding: 40px 70px;
      color: var(--muted);
      font-size: 22px;
    }

    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(1,3,10,.98);
    }

    .modal.open { display: flex; }

    .player-shell {
      position: relative;
      width: 1700px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 100px rgba(0,0,0,.8);
    }

    #yt,
    #yt iframe {
      width: 100%;
      height: 100%;
    }

    .close {
      position: absolute;
      z-index: 3;
      top: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(0,0,0,.62);
      font-size: 24px;
      cursor: pointer;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: #05070d;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <span>Trailer Hub</span>
      </div>
      <input id="searchInput" class="search" type="text" placeholder="Buscar filmes">
    </header>

    <section id="hero" class="hero">
      <img id="heroBackdrop" class="hero-backdrop" alt="">
      <div class="hero-shade"></div>
      <div class="hero-content">
        <div class="eyebrow">Trailer em destaque</div>
        <h1 id="heroTitle" class="hero-title">Trailer Hub</h1>
        <div id="heroMeta" class="hero-meta"></div>
        <p id="heroDescription" class="hero-description">Carregando filmes...</p>
        <button id="heroPlay" class="play" type="button">▶ Assistir trailer</button>
      </div>
    </section>

    <main id="content" class="content">
      <div class="status">Carregando catálogo...</div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="player-shell">
      <button id="closeButton" class="close">✕</button>
      <div id="yt"></div>
      <div id="loading" class="loading">Carregando trailer...</div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var API_KEY = "a47898db471d486bdee5adf41ba00783";
    var API = "https://api.themoviedb.org/3";
    var IMG = "https://image.tmdb.org/t/p";

    var heroMovie = null;
    var rows = [];
    var focusRow = -1;
    var focusCol = 0;
    var player = null;
    var playerReady = false;
    var pendingVideo = null;
    var searchTimer = null;

    var rowConfigs = [
      { title: "Em alta", path: "/trending/movie/week" },
      { title: "Populares", path: "/movie/popular" },
      { title: "Mais bem avaliados", path: "/movie/top_rated" },
      { title: "Lançamentos", path: "/movie/now_playing" },
      { title: "Para toda a família", path: "/discover/movie", params: { with_genres: 10751, sort_by: "popularity.desc" } }
    ];

    function request(path, params) {
      return new Promise(function(resolve, reject) {
        params = params || {};
        var query = [
          "api_key=" + encodeURIComponent(API_KEY),
          "language=pt-BR"
        ];

        Object.keys(params).forEach(function(key) {
          query.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key]));
        });

        var xhr = new XMLHttpRequest();
        xhr.open("GET", API + path + "?" + query.join("&"), true);
        xhr.timeout = 20000;

        xhr.onreadystatechange = function() {
          if (xhr.readyState !== 4) return;
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              resolve(JSON.parse(xhr.responseText));
            } catch (e) {
              reject(new Error("Resposta inválida"));
            }
          } else {
            reject(new Error("Erro " + xhr.status));
          }
        };

        xhr.onerror = function() { reject(new Error("Sem conexão")); };
        xhr.ontimeout = function() { reject(new Error("Tempo esgotado")); };
        xhr.send();
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setHero(movie) {
      if (!movie) return;
      heroMovie = movie;

      document.getElementById("heroTitle").textContent = movie.title || "Trailer Hub";
      document.getElementById("heroMeta").textContent =
        (movie.release_date ? movie.release_date.slice(0,4) : "") +
        (movie.vote_average ? "  •  ★ " + Number(movie.vote_average).toFixed(1) : "");
      document.getElementById("heroDescription").textContent =
        movie.overview || "Assista ao trailer deste filme.";

      var hero = document.getElementById("hero");
      var img = document.getElementById("heroBackdrop");
      hero.className = "hero";
      img.onload = function() { hero.className = "hero ready"; };
      img.src = movie.backdrop_path ? IMG + "/original" + movie.backdrop_path : "";
    }

    function makeCard(movie, rowIndex, colIndex) {
      var card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.setAttribute("data-row", rowIndex);
      card.setAttribute("data-col", colIndex);

      var year = movie.release_date ? movie.release_date.slice(0,4) : "";
      var poster = movie.poster_path ? IMG + "/w342" + movie.poster_path : "";

      card.innerHTML =
        '<div class="poster-wrap">' +
          (poster
            ? '<img class="poster" src="' + poster + '" alt="' + escapeHtml(movie.title || "") + '">'
            : '<div class="loading">' + escapeHtml(movie.title || "") + '</div>') +
        '</div>' +
        '<div class="card-title">' + escapeHtml(movie.title || "") + '</div>' +
        '<div class="card-year">' + escapeHtml(year) + '</div>';

      card.onclick = function() { openTrailer(movie); };
      card.onfocus = function() {
        focusRow = rowIndex;
        focusCol = colIndex;
        clearFocus();
        card.className = "card focused";
        setHero(movie);
      };

      return card;
    }

    function renderRows(dataRows) {
      var content = document.getElementById("content");
      content.innerHTML = "";
      rows = [];

      dataRows.forEach(function(group, rowIndex) {
        var section = document.createElement("section");
        section.className = "row";

        var title = document.createElement("h2");
        title.className = "row-title";
        title.textContent = group.title;

        var rail = document.createElement("div");
        rail.className = "rail";

        var movies = (group.movies || []).filter(function(m) {
          return m && m.title && m.poster_path;
        }).slice(0, 14);

        rows.push(movies);

        movies.forEach(function(movie, colIndex) {
          rail.appendChild(makeCard(movie, rowIndex, colIndex));
        });

        section.appendChild(title);
        section.appendChild(rail);
        content.appendChild(section);
      });

      if (rows[0] && rows[0][0]) {
        setHero(rows[0][0]);
        setTimeout(function() { focusCard(0, 0); }, 300);
      }
    }

    function clearFocus() {
      var list = document.querySelectorAll(".card.focused");
      for (var i = 0; i < list.length; i++) {
        list[i].className = "card";
      }
    }

    function focusCard(r, c) {
      if (!rows.length) return;
      r = Math.max(0, Math.min(r, rows.length - 1));
      c = Math.max(0, Math.min(c, rows[r].length - 1));

      var card = document.querySelector('.card[data-row="' + r + '"][data-col="' + c + '"]');
      if (!card) return;

      focusRow = r;
      focusCol = c;
      card.focus();
      card.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
    }

    function loadHome() {
      Promise.all(rowConfigs.map(function(config) {
        return request(config.path, config.params || {})
          .then(function(data) {
            return { title: config.title, movies: data.results || [] };
          });
      }))
      .then(renderRows)
      .catch(function(error) {
        document.getElementById("content").innerHTML =
          '<div class="status">Não foi possível carregar o catálogo: ' +
          escapeHtml(error.message) + '</div>';
      });
    }

    function searchMovies(query) {
      if (!query) {
        loadHome();
        return;
      }

      request("/search/movie", { query: query, include_adult: false })
        .then(function(data) {
          renderRows([{ title: 'Resultados para “' + query + '”', movies: data.results || [] }]);
        })
        .catch(function(error) {
          document.getElementById("content").innerHTML =
            '<div class="status">Erro na busca: ' + escapeHtml(error.message) + '</div>';
        });
    }

    function getTrailer(movieId) {
      return request("/movie/" + movieId + "/videos", {})
        .then(function(data) {
          var videos = (data.results || []).filter(function(v) {
            return v.site === "YouTube" && v.key;
          });

          var preferred = videos.find(function(v) {
            return v.type === "Trailer" && v.official;
          }) || videos.find(function(v) {
            return v.type === "Trailer";
          }) || videos[0];

          return preferred ? preferred.key : null;
        });
    }

    function openTrailer(movie) {
      var modal = document.getElementById("modal");
      var loading = document.getElementById("loading");
      modal.className = "modal open";
      loading.style.display = "grid";
      loading.textContent = "Carregando trailer...";

      getTrailer(movie.id).then(function(videoId) {
        if (!videoId) {
          loading.textContent = "Trailer não encontrado.";
          return;
        }

        if (playerReady && player) {
          loading.style.display = "none";
          player.loadVideoById(videoId);
        } else {
          pendingVideo = videoId;
        }
      }).catch(function(error) {
        loading.textContent = "Erro ao carregar trailer.";
      });
    }

    function closeModal() {
      document.getElementById("modal").className = "modal";
      if (player && player.stopVideo) player.stopVideo();
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("yt", {
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: function() {
            playerReady = true;
            if (pendingVideo) {
              document.getElementById("loading").style.display = "none";
              player.loadVideoById(pendingVideo);
              pendingVideo = null;
            }
          }
        }
      });
    }

    document.getElementById("heroPlay").onclick = function() {
      if (heroMovie) openTrailer(heroMovie);
    };

    document.getElementById("closeButton").onclick = closeModal;

    document.getElementById("searchInput").oninput = function() {
      clearTimeout(searchTimer);
      var value = this.value.trim();
      searchTimer = setTimeout(function() {
        searchMovies(value);
      }, 350);
    };

    document.addEventListener("keydown", function(event) {
      if (document.getElementById("modal").className.indexOf("open") !== -1) {
        if (event.key === "Backspace" || event.key === "Escape") {
          event.preventDefault();
          closeModal();
        }
        return;
      }

      if (document.activeElement === document.getElementById("searchInput")) {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          focusCard(0, 0);
        }
        return;
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        focusCard(focusRow, focusCol + 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        focusCard(focusRow, focusCol - 1);
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        focusCard(focusRow + 1, focusCol);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        if (focusRow <= 0) {
          document.getElementById("searchInput").focus();
        } else {
          focusCard(focusRow - 1, focusCol);
        }
      } else if (event.key === "Enter") {
        var active = document.activeElement;
        if (active && active.className.indexOf("card") !== -1) {
          active.click();
        }
      }
    });

    loadHome();
  </script>
</body>
</html>
